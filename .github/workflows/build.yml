name: Build Theos Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl libxml2-utils make dpkg-dev xz-utils bzip2 tar perl

      - name: Setup Theos and iOS SDKs
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS
          
          # استنساخ ثيوس مع كافة ملفاته الفرعية (بما فيها dm.pl) من أول مرة وبدون أخطاء
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # إعداد مجلد الـ SDKs بشكل نظيف
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
          
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build deb package
        run: |
          export THEOS=$HOME/theos
          make package THEOS_PACKAGE_SCHEME=rootless

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BountyMod-deb
          path: packages/*.deb
